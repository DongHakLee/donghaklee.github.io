<!-- Bootstrap Icons을 포함 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">

<style>

.comment-form {
    margin-bottom: 1.5rem;
    border-radius: 0.5rem;
  }

  .form-row {
    display: flex;
    flex-wrap: nowrap;
    margin: -0.5rem;
  }

  .form-row > div {
    flex: 1 1 300px;
    padding: 0.5rem;
  }

  .form-label {
    font-weight: bold;
    margin-bottom: 0.25rem;
  }

  .form-control {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #ccc;
    border-radius: 0.25rem;
  }

  .char-count {
    text-align: right;
    font-size: 0.875rem;
    color: #666;
  }

  .captcha-section {
    margin-top: 1rem;
    padding: 1rem;
    background-color: #f5f5f5;
    border-radius: 0.5rem;
  }

  .captcha-canvas {
    display: block;
    margin-bottom: 0.5rem;
  }

  .submit-btn {
    float: right;
    background-color: #007bff;
    color: #fff;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 0.25rem;
    cursor: pointer;
  }

  .submit-btn:hover {
    background-color: #0056b3;
  }

  .captcha-popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }


</style>



<div id="comments" class="row mx-0 justify-content-center mt-5">
    <h3>Comments</h3>
    
    <!-- 댓글 목록 -->
    <div id="comments-section" class="mb-4">
        
    </div>


    <div id="captcha-section" class="captcha-section d-none"></div>
        <div class="captcha-popup-content">
        <label for="captcha" class="form-label">Solve the CAPTCHA</label>
        <canvas id="captcha-canvas" width="180" height="60" class="captcha-canvas"></canvas>
        <input type="number" class="form-control" id="captcha-answer" placeholder="Enter CAPTCHA answer" required>
        <input type="hidden" id="captcha-id">
        <button type="button" class="submit-btn" id="verify-captcha-btn">Submit CAPTCHA</button>
        </div>
    </div>

    <form id="comment-form" class="comment-form px-3" >
        {% assign id_number = page.permalink | split: '/' | last %}
        <input type="hidden" id="post_id" value="{{id_number}}">
      
        <div class="form-row my-1">
          <div>
            <input type="text" class="form-control" id="user_name" placeholder="닉네임" required>
          </div>
          <div>
            <input type="password" class="form-control" id="password" placeholder="비밀번호" required>
          </div>
        </div>
      
        <div class="form-group">
          <textarea class="form-control" id="comment" rows="4" placeholder="" maxlength="500" required></textarea>
          <div class="char-count"><span id="char-count">0</span> / 500</div>
        </div>
      

      
        <button type="button" class="submit-btn" id="generate-captcha-btn">Submit</button>
      </form>
    
    <!-- Toast 알림 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container">
        <div id="toast-message" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
    const apiUrl = 'https://ep-core.mynews1237.workers.dev';

    // 댓글 길이 제한과 현재 글자 수 표시
    const commentTextarea = document.getElementById('comment');
    const charCountDisplay = document.getElementById('char-count');

    commentTextarea.addEventListener('input', () => {
        const currentLength = commentTextarea.value.length;
        if (currentLength > 500) {
            commentTextarea.value = commentTextarea.value.slice(0, 500);
        }
        charCountDisplay.textContent = currentLength;
    });

    // Toast 메시지 표시
    function showToast(message) {
        alert(message);
    }

    // 댓글 목록 불러오기
    async function fetchComments() {
        const postId = document.getElementById('post_id').value;
        try {
            const response = await fetch(`${apiUrl}/comments?post_id=${postId}`);
            const data = await response.json();
            displayComments(data.results || []);
        } catch (error) {
            console.error('Error fetching comments:', error);
            showToast('Error fetching comments. Please try again.');
        }
    }

    // 한국식 날짜 형식 변환 함수
    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString('ko-KR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
        });
    }

    // 댓글 목록 표시하기
    function displayComments(comments) {
        const commentsSection = document.getElementById('comments-section');
        commentsSection.innerHTML = '';
        comments.forEach(comment => {
            const commentElement = document.createElement('div');
            commentElement.classList.add("border", "p-3", "mb-2", "rounded");

            commentElement.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-person-fill me-1"></i><strong>${comment.user_name}</strong>
                    </div>
                    <button class="btn btn-link p-0 m-0 text-decoration-none" onclick="deleteComment(${comment.id})">
                        <i class="bi bi-trash" style="font-size: 1.2em;"></i>
                    </button>
                </div>
                <small class="text-muted">${formatDate(comment.created_at)}</small>
                <p class="mt-2">${comment.comment}</p>
            `;
            commentsSection.appendChild(commentElement);
        });
    }

    // CAPTCHA 생성
    document.getElementById('generate-captcha-btn').addEventListener('click', async () => {
        const user_name = document.getElementById('user_name').value;
        const comment = document.getElementById('comment').value;
        const post_id = document.getElementById('post_id').value;

        try {
            const response = await fetch(`${apiUrl}/generate-captcha`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id, user_name, comment })
            });
            const data = await response.json();

            // CAPTCHA 질문을 Canvas에 렌더링
            const canvas = document.getElementById('captcha-canvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height); // 캔버스 초기화
            context.font = "20px Arial";
            context.fillStyle = "black";
            context.fillText(data.question, 10, 30);

            document.getElementById('captcha-id').value = data.captchaId;
            document.getElementById('captcha-section').classList.remove('d-none');
        } catch (error) {
            console.error('Error generating CAPTCHA:', error);
            showToast('Error generating CAPTCHA. Please try again.');
        }
    });

    // CAPTCHA 검증 및 댓글 저장
    document.getElementById('verify-captcha-btn').addEventListener('click', async () => {
        const captchaAnswer = document.getElementById('captcha-answer').value;
        const captchaId = document.getElementById('captcha-id').value;
        const post_id = document.getElementById('post_id').value;
        const user_name = document.getElementById('user_name').value;
        const comment = document.getElementById('comment').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${apiUrl}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id, user_name, comment, password, captchaId, captchaAnswer })
            });
            
            if (response.ok) {
                showToast('Comment added successfully!');
                fetchComments();
                
                // 댓글 작성 폼과 CAPTCHA 초기화
                document.getElementById('comment-form').reset();
                document.getElementById('captcha-section').classList.add('d-none');
                document.getElementById('captcha-answer').value = ""; // 답변 초기화
                document.getElementById('captcha-id').value = ""; // CAPTCHA ID 초기화
                charCountDisplay.textContent = "0"; // 글자 수 초기화
            } else {
                showToast('Incorrect CAPTCHA, please try again.');
                document.getElementById('captcha-section').classList.add('d-none');
            }
        } catch (error) {
            console.error('Error verifying CAPTCHA:', error);
            showToast('Error verifying CAPTCHA. Please try again.');
        }
    });

    // 댓글 삭제
    async function deleteComment(commentId) {
        const password = prompt("Enter the password to delete this comment:");
        if (!password) return;

        try {
            const response = await fetch(`${apiUrl}/comments`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment_id: commentId, password })
            });

            if (response.ok) {
                showToast('Comment deleted successfully!');
                fetchComments();
            } else {
                showToast('Incorrect password. Unable to delete the comment.');
            }
        } catch (error) {
            console.error('Error deleting comment:', error);
            showToast('Error deleting comment. Please try again.');
        }
    }

    // 페이지 로드 시 댓글 목록 불러오기
    fetchComments();
</script>
