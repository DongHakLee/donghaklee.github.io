<style>
:root {
  /* Floating button */
  --floating-btn-bg-color: var(--bg-color); /* 배경색 */
  --floating-btn-text-color: var(--text-color); /* 텍스트 색상 */
  --floating-btn-hover-bg-color: var(--hover-color); /* 호버 배경색 */
  --floating-btn-border-color: var(--border-color); /* 기본 테두리 */
  --floating-btn-hover-border-color: var(--hover-color); /* 호버 테두리 */
}

[data-theme="dark"] {
  --floating-btn-bg-color: var(--button-bg-color); /* 다크 테마 배경 */
  --floating-btn-text-color: var(--button-text-color); /* 다크 테마 텍스트 */
  --floating-btn-hover-bg-color: var(--button-hover-bg-color); /* 다크 테마 호버 배경 */
  --floating-btn-border-color: var(--sample-ad-border-color); /* 다크 테마 테두리 */
  --floating-btn-hover-border-color: var(--button-hover-bg-color); /* 다크 테마 호버 테두리 */
}

/* Floating Container */
.floating-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

/* Floating Button */
.floating-btn {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background-color: var(--floating-btn-bg-color);
  color: var(--floating-btn-text-color);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid var(--floating-btn-border-color); /* 테두리 추가 */
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.floating-btn:hover {
  background-color: var(--floating-btn-hover-bg-color);
  border-color: var(--floating-btn-hover-border-color); /* 호버 시 테두리 강조 */
}

.floating-btn.hidden {
  opacity: 0;
  visibility: hidden;
}

/* Function Buttons */
.function-buttons {
  position: absolute;
  display: flex;
  bottom: 0;
  right: 70px;
  gap: 10px;
  visibility: hidden;
  opacity: 0;
  transition: all 0.3s ease;
}

.function-buttons.active {
  visibility: visible;
  opacity: 1;
}

.function-btn {
  position: relative; /* sup 배치를 위한 기준 */
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background-color: var(--floating-btn-bg-color);
  color: var(--floating-btn-text-color);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid var(--floating-btn-border-color);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
  font-size: 21px;
}

.function-btn:hover {
  background-color: var(--floating-btn-hover-bg-color);
  border-color: var(--floating-btn-hover-border-color); /* 호버 테두리 강조 */
}

.button-content {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.sup-text-floating {
  font-size: 16px;
  font-weight: bold;
  color: var(--text-color);
  position: absolute;
  pointer-events: none;
}
.sup-text-floating.plus {
  top: -11px;
  right: -6px;
}
.sup-text-floating.minus {
  top: -13px;
  right: -5px;;
}
.fs-16 {
  font-size: 16px;
}
</style>




<div class="floating-container">
    <!-- "Scroll to Top" Button -->
    <div id="scrollTopButton" class="floating-btn" title="Scroll to Top">
        <i class="bi bi-arrow-up"></i>
    </div>

    <!-- Main Button -->
    <div id="mainButton" class="floating-btn" title="Menu">
        <i class="bi bi-three-dots"></i>
    </div>

    <!-- Function Buttons -->
    <div id="functionButtons" class="function-buttons">
        <!-- Copy URL Button -->
        <button id="copyButton" class="function-btn" title="Copy URL">
            <i class="bi bi-link-45deg"></i>
        </button>
        <!-- Zoom Out Button -->
        <button id="zoomOutButton" class="function-btn fs-16" title="Zoom Out">
            <div class="button-content">
                <span>가</span>
                <span class="sup-text-floating minus">-</span>
            </div>
        </button>
        <!-- Zoom In Button -->
        <button id="zoomInButton" class="function-btn" title="Zoom In">
            <div class="button-content">
                <span>가</span>
                <span class="sup-text-floating plus">+</span>
            </div>
        </button>
        <!-- Print Button -->
        <button id="printButton" class="function-btn" title="Print">
            <i class="bi bi-printer"></i>
        </button>
    </div>
</div>


<script>
    const scrollTopButton = document.getElementById('scrollTopButton');
    const mainButton = document.getElementById('mainButton');
    const functionButtons = document.getElementById('functionButtons');
    const copyButton = document.getElementById('copyButton');
    const zoomOutButton = document.getElementById('zoomOutButton');
    const zoomInButton = document.getElementById('zoomInButton');
    const printButton = document.getElementById('printButton');

    //const facebookButton = document.getElementById('facebookButton');
    //const xButton = document.getElementById('xButton');

    // Scroll event to show/hide menu bar and "scroll to top" button
    document.addEventListener('scroll', function() {
        if (window.scrollY > 100) {
            scrollTopButton.classList.remove('hidden');
        } else {
            scrollTopButton.classList.add('hidden');
        }
    });

    // Scroll to top functionality
    scrollTopButton.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    zoomOutButton.addEventListener('click', () => {
        console.log(adjustFontSize)
        adjustFontSize('-')
    });

    zoomInButton.addEventListener('click', () => {
        console.log(adjustFontSize)
        adjustFontSize('+')
    });

    printButton.addEventListener('click', () => {
        console.log(printPage)
        printPage();
    });

    // Facebook 공유 버튼
    /*
    facebookButton.addEventListener('click', () => {
        closeFunctionButton();
        const url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    });

    // X 공유 버튼
    xButton.addEventListener('click', () => {
        closeFunctionButton();
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?url=${url}`, '_blank');
    });
    */




    // Toggle function buttons visibility
    mainButton.addEventListener('click', () => {
        functionButtons.classList.toggle('active');
    });

    copyButton.addEventListener('click', () => {
        closeFunctionButton();
        navigator.clipboard.writeText(window.location.href)
            .then(() => showToast('noti','URL이 클립보드에 복사 되었습니다.'))
            .catch(err => console.error('alert','URL을 복사할 수 없습니다.'));
    });
    
    function closeFunctionButton(){
        functionButtons.classList.remove('active');
    }

</script>
