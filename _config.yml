# Site
name: '도담뉴스'
description: '최신 이슈, 심층 보도, 그리고 독자와 세상을 연결하는 도담뉴스입니다.'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ''
disqus: 'demowebsite'
email: 'leedongja111@gmail.com'
mailchimp-list: 'https://wowthemes.us11.list-manage.com/subscribe/post?u=8aeb20a530e124561927d3bd8&amp;id=8c3d2d214b'
menu_name_company: '매체 소개'
menu_name_contact: '문의하기'
menu_name_terms: '이용약관'

remove_generator_tag: false # 커스텀 generator 정보를 사용하려면

include: ["_pages"]

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

authors:
    sal:
      name:           Sal
      site:           https://www.wowthemes.net
      avatar:         /assets/images/avatar1.jpg
      bio:            "Hi, I am Sal, the author of Mundana, the theme you're currently previewing. I hope you like it!"
      email:          wowthemesnet@gmail.com
      twitter:        https://twitter.com/wowthemesnet

    jane:
      name:           Jane
      site:           https://www.wowthemes.net
      avatar:         /assets/images/avatar2.jpg
      bio:            "Blogger, fashionista, love to explore new ideas and write on my morning coffee!"
      email:          fakemail@gmail.com
      twitter:        https://twitter.com/wowthemesnet

# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: sal
      avatar: /assets/images/avatar1.jpg
      image_converter:
        enabled: true

  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page

# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
pagination:
  enabled: true
  per_page: 8  # 전역 per_page 설정
  sort_field: date
  sort_reverse: true
  

company:
  name: "도담뉴스"
  ceo: "이동학"
  registration_number: "161-47-00805"
  address: "대전광역시 서구 신갈마로 58-16 동산빌 203호"
  phone: "010-2628-6546"
  email: "leedongja222333@gmail.com"


# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [
  README.markdown
, package.json
, grunt.js
, Gruntfile.js
, Gruntfile.coffee
, node_modules
]

ad_enable: false

ads:
  - ad1.html
  - ad2.html