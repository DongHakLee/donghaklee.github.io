theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "mint" # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# Site Settings
locale: "ko-KR"
title: "DongHak's Dev Notes"
title_separator: "·"
subtitle: "유용한 GitHub 저장소와 URL을 한글로 정리합니다"
name: "이동학"
description: "개발자 이동학의 기술 블로그. 유용한 GitHub 저장소, 도구, 라이브러리 사용법을 한글로 정리합니다."
url: "https://donghaklee.github.io"
baseurl: ""
repository: "DongHakLee/donghaklee.github.io"

# Analytics
analytics:
  provider: false

# Site Author
author:
  name: "이동학"
  avatar: "https://avatars.githubusercontent.com/u/42929353"
  bio: "유용한 GitHub 저장소와 URL을 한글로 정리합니다."
  location: "Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DongHakLee"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:leedongja111@gmail.com"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DongHakLee"

# Reading Files
include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/
timezone: Asia/Seoul

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
