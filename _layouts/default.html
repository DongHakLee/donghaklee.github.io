<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{page.title}} | {{site.name}}</title>

    {% seo %}

    <link rel="shortcut icon" type="image/x-icon" href="{{site.baseurl}}/{{site.favicon}}">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">

    <!-- Google Fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Modified -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <!-- Theme Stylesheet -->
    <!-- <link rel="stylesheet" href="{{site.baseurl}}/assets/css/theme.css"> -->

    <!-- Jquery on header to make sure everything works, the rest  of the scripts in footer for fast loading -->
    <script
    src="https://code.jquery.com/jquery-3.3.1.min.js"
    integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
    crossorigin="anonymous"></script>

    <style>
        #scrollingMenu, #scrollingHiddenMenu {
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: auto;
        }
        #scrollingMenu ul, #scrollingHiddenMenu ul {
            padding-left: 0;
            margin: 0;
        }
        #scrollingMenu li, #scrollingHiddenMenu li {
            list-style: none;
            margin-right: 20px;
        }
        #scrollingMenu a, #scrollingHiddenMenu a {
            text-decoration: none;
            color: #000;
            padding: 5px 10px;
        }
        #scrollingMenu a.active, #scrollingHiddenMenu a.active {
            font-weight: bold;
            color: #007bff;
            border-bottom: 2px solid #007bff;
        }
        #scrollingMenu a:focus, #scrollingHiddenMenu a:focus {
            outline: none;
        }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const activeLink = document.querySelector("#scrollingMenu a.active");
            if (activeLink) {
                activeLink.scrollIntoView({ behavior: "auto", block: "nearest", inline: "center" });
            }
    
            let lastScrollTop = 0;
            window.addEventListener("scroll", function() {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const hiddenMenuBar = document.getElementById("hiddenMenuBar");
                const brandSection = document.getElementById("brandSection");
                
                if (scrollTop > 100) {
                    hiddenMenuBar.style.display = "block";
                } else {
                    hiddenMenuBar.style.display = "none";
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    
                // Update scroll progress bar
                const scrollProgressBar = document.getElementById("scrollProgressBar");
                const totalHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const progress = (scrollTop / totalHeight) * 100;
                scrollProgressBar.style.width = progress + "%";
            });
        });
    </script>

    

    {% include tracking-header.html %}


</head>

<body class="{% if page.url == "/" %} homefirstpage {% endif %}">

<!-- Navbar -->
<nav id="MagicMenu" class="topnav navbar navbar-light bg-white" >
    <div class="container flex-column">
        <!-- Logo Section -->
        <div id="brandSection" class="text-center w-100 py-3 border-bottom">
            <a class="navbar-brand" href="{{ site.baseurl }}/"><strong>{{site.name}}</strong></a>
        </div>
        
        <!-- Menu Section -->
        <div class="w-100">
            <div id="scrollingMenu" class="d-flex overflow-auto py-2 justify-content-start">
                <ul class="navbar-nav d-flex flex-row mx-auto">
                    {% include menu-header.html %}
                </ul>
            </div>
        </div>
    </div>
    
    <!-- Hidden Menu Bar -->
    <div id="hiddenMenuBar" class="topnav navbar navbar-light bg-light fixed-top" style="display: none;">
        <div class="container flex-column">
            <div class="w-100">
                <div id="scrollingHiddenMenu" class="d-flex overflow-auto py-2 justify-content-start">
                    <ul class="navbar-nav d-flex flex-row mx-auto">
                        {% include menu-header.html %}
                    </ul>
                </div>
                <!-- Scroll Progress Bar Inside Hidden Menu Bar -->
                <div id="scrollProgressBar" style="height: 5px; background-color: #007bff; width: 0;"></div>
            </div>
        </div>
    </div>
</nav>






    <!-- Search Results -->
    <div id="lunrsearchresults">
        <ul class="mb-0"></ul>
    </div>

    <!-- Content -->
    <main role="main" class="site-content">
        {{ content }}
    </main>


    <!-- Scripts: popper, bootstrap, theme, lunr -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>

    <script src="{{site.baseurl}}/assets/js/theme.js"></script>


    <!-- Footer -->
    <footer class="bg-white border-top p-3 text-muted small">
        <div class="container">
        <div class="row align-items-center justify-content-between">
            <div>
                <span class="navbar-brand mr-2 mb-0"><strong>{{site.name}}</strong></span>
                <span>Copyright © <script>document.write(new Date().getFullYear())</script>.</span>

                <!--  Github Repo Star Btn-->

            </div>
            <div>
                Made with <a target="_blank" class="text-dark font-weight-bold" href="https://www.wowthemes.net/mundana-jekyll-theme/"> Mundana Jekyll Theme </a> by <a class="text-dark" target="_blank" href="https://www.wowthemes.net">WowThemes</a>.
            </div>
        </div>
        </div>
    </footer>

    {% include tracking-footer.html %}

</body>

</html>
