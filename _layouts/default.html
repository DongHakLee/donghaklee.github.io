<script>
    // Toast 메시지 표시
    function showToast(type, message) {
        COMMON.showToast(type, message);
    }

	const root = document.documentElement;
	const navbarHeight = getComputedStyle(root).getPropertyValue('--navbar-height').trim(); 	
	const searchButton = document.getElementById('searchButton');
	const searchButtonDesktop = document.getElementById('searchButtonDesktop');
	const searchOverlay = document.getElementById('searchOverlay');
	const closeSearch = document.getElementById('closeSearch');
	const hamburgerButton = document.getElementById('hamburgerButton');
	const hamburgerMenu = document.getElementById('hamburgerMenu');
	const overlay = document.getElementById('overlay');
	const closeMenu = document.getElementById('closeMenu');
	const desktopNav = document.getElementById('desktopNav');
	const menuBarDesktop = document.getElementById('menuBarDesktop');
	const body = document.body;
    const themeKey = 'dhlTheme';
	let lastScrollTop = 0;

	// 검색창 동작
	searchButton?.addEventListener('click', () => {
	  searchOverlay.classList.add('active');
	});
	// 검색창 동작
	searchButtonDesktop?.addEventListener('click', () => {
	  searchOverlay.classList.add('active');
	});
	// 검색창 닫기
	closeSearch?.addEventListener('click', () => {
	  searchOverlay.classList.remove('active');
	});
	// 슬라이드 메뉴 동작
	hamburgerButton?.addEventListener('click', () => {
	  hamburgerMenu.classList.add('active');
	  overlay.classList.add('active');
	});

	closeMenu?.addEventListener('click', () => {
	  hamburgerMenu.classList.remove('active');
	  overlay.classList.remove('active');
	});

	// 스크롤 방향에 따라 태블릿 네비게이션 동작
	window.addEventListener('scroll', () => {
	  const currentScroll = window.scrollY;

	  if (currentScroll > lastScrollTop) {
		// 아래로 스크롤: navbar 숨기기, menu-bar 최상단 고정
		desktopNav.classList.add('hidden');
		menuBarDesktop.style.top = '0'; // menu-bar를 최상단으로 이동
	  } else {
		// 위로 스크롤: navbar 보이기, menu-bar 원래 위치로 복귀
		desktopNav.classList.remove('hidden');
		//console.log('navbarHeight',navbarHeight)
		menuBarDesktop.style.top = navbarHeight; // navbar 높이만큼 아래로 이동
	  }

	  lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; // 스크롤 위치 업데이트
	});


	// 투명막 클릭 시 메뉴 닫기
	overlay.addEventListener('click', () => {
	  hamburgerMenu.classList.remove('active');
	  overlay.classList.remove('active');
	});
	

	// 테마 드롭다운 처리
    const themeDropdowns = document.querySelectorAll('.theme-dropdown');

    themeDropdowns.forEach(dropdown => {
    const button = dropdown.querySelector('.theme-button');
    const menu = dropdown.querySelector('.theme-dropdown-menu');
    const options = menu.querySelectorAll('.theme-option');
    const currentThemeDisplay = dropdown.querySelector('#currentTheme');

    // 로컬 스토리지에서 테마 읽기 (기본값: 'auto')
    const savedTheme = localStorage.getItem(themeKey) || 'auto';

    // 초기화: 테마 설정
    if (savedTheme === 'auto') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.setAttribute('data-theme', prefersDarkScheme ? 'dark' : 'light');
    } else {
        document.body.setAttribute('data-theme', savedTheme);
    }

    // 초기화: 저장된 테마로 현재 테마 표시 업데이트
    const initialOption = [...options].find(option => option.getAttribute('data-theme') === savedTheme);
    if (initialOption) {
        currentThemeDisplay.innerHTML = initialOption.innerHTML.split('</i>')[0] + '</i>';
    }

    // 드롭다운 열기/닫기
    button.addEventListener('click', () => {
        menu.classList.toggle('active');
    });

    // 옵션 선택 시 테마 변경
    options.forEach(option => {
        option.addEventListener('click', () => {
        const selectedTheme = option.getAttribute('data-theme');

        // 테마 설정
        if (selectedTheme === 'auto') {
            const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.setAttribute('data-theme', prefersDarkScheme ? 'dark' : 'light');
        } else {
            document.body.setAttribute('data-theme', selectedTheme);
        }

        // 로컬 스토리지에 테마 저장
        localStorage.setItem(themeKey, selectedTheme);

        // 현재 테마 버튼 업데이트
        currentThemeDisplay.innerHTML = option.innerHTML.split('</i>')[0] + '</i>';

        // 드롭다운 메뉴 닫기
        menu.classList.remove('active');
        });
    });

    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', (event) => {
        if (!dropdown.contains(event.target)) {
        menu.classList.remove('active');
        }
    });
    });

    document.addEventListener("DOMContentLoaded", function () {
        const pageLinks = document.querySelectorAll(".page-link");
        pageLinks.forEach(link => {
            link.addEventListener("click", function () {
                const loader = document.createElement("div");
                loader.className = "spinner-border text-primary";
                loader.setAttribute("role", "status");
                document.body.appendChild(loader);
            });
        });

        document.addEventListener('touchend', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault(); // 여러 손가락 확대 방지
            }
        });

        //themeDropdownMenu.classList.remove('active');


        // 로컬 스토리지에서 저장된 테마 읽기
        const savedTheme = localStorage.getItem(themeKey) || 'auto';

        // 테마 적용
        if (savedTheme === 'auto') {
            const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.setAttribute('data-theme', prefersDarkScheme ? 'dark' : 'light');
        } else {
            document.body.setAttribute('data-theme', savedTheme);
        }

        // 테마 적용 완료 후 화면 표시
        document.body.classList.add('theme-loaded');
    
});
